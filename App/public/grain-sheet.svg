<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!--
    Фактура листа: не плёночное зерно, а то, чем переработанная бумага
    отличается на глаз — редкие вкрапления небеленой целлюлозы поверх мелкой
    шероховатости полотна.

    Плотность подобрана замером по пикселям: крапины занимают 0.56% площади при
    перепаде до 95/255, зерно — 33% при среднем перепаде 2.75. Сильнее уже
    читается как грязный лист, слабее не видно вовсе.

    Как это устроено: степенная функция альфы давит середину распределения шума
    почти в ноль и вытягивает верхушку до единицы, поэтому из ровной ряби
    получаются отдельные крапины. Цвет вкрапления (bark) задаёт красящая
    матрица прямо в фильтре.

    color-interpolation-filters="sRGB" обязателен: в linearRGB по умолчанию те
    же коэффициенты дают совсем другую плотность.
  -->
  <defs>
    <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.298  0 0 0 0 0.286  0 0 0 0 0.251  0.35 0 0 0 -0.16"/>
    </filter>
    <filter id="flecks" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.5" numOctaves="1" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.298  0 0 0 0 0.286  0 0 0 0 0.251  1 0 0 0 0"/>
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude="9" exponent="7" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="300" height="300" filter="url(#tooth)" opacity="0.5"/>
  <rect width="300" height="300" filter="url(#flecks)" opacity="0.55"/>
</svg>

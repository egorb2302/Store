<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!--
    Тёмные полосы — тот же материал, крашеный насквозь: вкрапления на нём
    читаются светлыми. Непрозрачность ниже, иначе крапины на хвойном начинают
    спорить с текстом, которого на этих полосах немало.
  -->
  <defs>
    <filter id="tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.929  0 0 0 0 0.941  0 0 0 0 0.906  0.3 0 0 0 -0.15"/>
    </filter>
    <filter id="flecks" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.5" numOctaves="1" seed="41" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.929  0 0 0 0 0.941  0 0 0 0 0.906  1 0 0 0 0"/>
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude="9" exponent="8" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="300" height="300" filter="url(#tooth)" opacity="0.35"/>
  <rect width="300" height="300" filter="url(#flecks)" opacity="0.4"/>
</svg>
